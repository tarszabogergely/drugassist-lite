<!DOCTYPE html>
<html lang="hu">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>DrugAssist Lite - Ellenőrzésre váró betegek</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    
<style>

body{

    margin:0;

    font-family:"Segoe UI",Arial,sans-serif;

    background:#f4f6f9;

}

/* HEADER */

header{

    background:white;

    padding:14px 32px;

    border-bottom:1px solid #e0e0e0;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

header h1{

    margin:0;

    font-size:22px;

    font-weight:600;

}

.header-right {
    display: flex;
    align-items: center;
    gap: 20px;
}

.user-info{

    color:#2c3e50;

    font-size:14px;

    font-weight: 500;

    display: flex;

    align-items: center;

    gap: 12px;

}

.clock-badge {
    background: #eef4fb;
    padding: 6px 12px;
    border-radius: 8px;
    color: #2980b9;
    font-weight: 600;
}

.logout-btn {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: 0.2s;
}

.logout-btn:hover {
    background: #c0392b;
}

/* CONTAINER */

.container{

    padding:32px;

}

/* DATE BAR / DÁTUMLÉPTETŐ */

.date-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    padding: 16px 24px;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    margin-bottom: 24px;
}

.date-picker-group {
    display: flex;
    align-items: center;
    gap: 12px;
}

.date-btn {
    background: #3498db;
    color: white;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
}

.date-btn:hover {
    background: #2980b9;
}

.current-date-display {
    font-size: 16px;
    font-weight: 600;
    color: #2c3e50;
    min-width: 140px;
    text-align: center;
}

.today-btn {
    background: #ecf0f1;
    color: #34495e;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.today-btn:hover {
    background: #bdc3c7;
}

/* BACK */

.back{

    margin-bottom:20px;

}

.back a{

    text-decoration:none;

    color:#1976d2;

    font-weight:600;

}

/* TITLE */

.title-card{

    background:white;

    border-radius:14px;

    padding:24px;

    box-shadow:0 4px 14px rgba(0,0,0,.05);

    margin-bottom:28px;

}

.title-card h2{

    margin:0;

}

.patient-count{

    color:#666;

    margin-top:8px;

}

/* SEARCH */

.search{

    margin-bottom:28px;

}

.search input{

    width:100%;

    padding:14px;

    border-radius:10px;

    border:1px solid #ccc;

    font-size:15px;

}

/* PATIENT GRID */

.patient-grid{

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(340px,1fr));

    gap:20px;

}

/* CARD */

.patient-card{

    background:white;

    border-radius:14px;

    padding:20px;

    cursor:pointer;

    transition:.2s;

    box-shadow:
        0 4px 14px rgba(0,0,0,.05);

}

.patient-card:hover{

    transform:translateY(-3px);

    box-shadow:
        0 8px 20px rgba(0,0,0,.08);

}

.patient-name{

    font-size:20px;

    font-weight:600;

}

.patient-bed{

    margin-top:8px;

    color:#666;

}

.status{

    margin-top:18px;

    display:inline-block;

    padding:6px 12px;

    border-radius:20px;

    background:#9e9e9e;

    color:white;

    font-size:13px;

}

</style>

</head>

<body>

<header>

    <h1>DrugAssist Lite</h1>

    <div class="header-right">
        <div class="user-info">
            <span id="userNameDisplay">Bejelentkezett felhasználó</span>
            <span id="clockDisplay" class="clock-badge">----.--.-- --:--</span>
        </div>
        <button class="logout-btn" onclick="Auth.logout()">Kijelentkezés</button>
    </div>

</header>

<div class="container">

    <!-- DÁTUMLÉPTETŐ PANEL -->
    <div class="date-bar">
        <div class="date-picker-group">
            <button class="date-btn" id="prevDayBtn">&lt;</button>
            <span class="current-date-display" id="selectedDateDisplay">----.--.--</span>
            <button class="date-btn" id="nextDayBtn">&gt;</button>
        </div>
        <button class="today-btn" id="todayBtn">Mai nap</button>
    </div>

    <div class="back">

        <a href="dashboard.html">

            ← Vissza a dashboardra

        </a>

    </div>

    <div class="title-card">

        <div class="title-header">

            <h2 id="wardTitle"></h2>

          

        </div>

        <div
            class="patient-count"
            id="patientCount">

        </div>

    </div>

    

    <div
        class="patient-grid"
        id="patientContainer">

    </div>

</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Konfiguráció, Hitelesítés és Tároló -->
<script src="js/config.js"></script>

<script>
  if (typeof supabase !== 'undefined' && supabase.createClient && CONFIG.supabase.url && !CONFIG.supabase.url.includes("YOUR_SUPABASE")) {
    window.supabase = supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey);
  }
</script>

<script src="js/auth.js"></script>
<script src="js/utils.js"></script>

<script src="js/storage.js"></script>

<script src="js/render.js"></script>

<script src="js/review-ward.js"></script>

<!-- Munkamenet-védelem, óra és napléptető logika -->
<script>
let currentDate = new Date();

function formatDateForDisplay(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}.${m}.${d}`;
}

function formatDateForQuery(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

function updateClock() {
    const now = new Date();
    const dateStr = formatDateForDisplay(now);
    const hours = String(now.getHours()).padStart(2, '0');
    const mins = String(now.getMinutes()).padStart(2, '0');
    document.getElementById("clockDisplay").innerText = `${dateStr} ${hours}:${mins}`;
}

async function loadReviewWardForSelectedDate() {
    const displayStr = formatDateForDisplay(currentDate);
    const queryStr = formatDateForQuery(currentDate);

    document.getElementById("selectedDateDisplay").innerText = displayStr;
    
    // Elérhetővé tesszük a kiválasztott dátumot a review-ward.js számára
    window.selectedWorkDate = queryStr;

    if (typeof ReviewWard !== "undefined" && typeof ReviewWard.init === "function") {
        await ReviewWard.init(queryStr);
    }
}

document.addEventListener("DOMContentLoaded", async () => {
    // 1. Munkamenet védelmi ellenőrzés
    const currentUser = Auth.requireAuth();
    if (currentUser) {
        document.getElementById("userNameDisplay").innerText = currentUser.name;
    }

    // 2. Óra indítása
    updateClock();
    setInterval(updateClock, 10000);

    // 3. Dátumléptető események
    document.getElementById("prevDayBtn").addEventListener("click", () => {
        currentDate.setDate(currentDate.getDate() - 1);
        loadReviewWardForSelectedDate();
    });

    document.getElementById("nextDayBtn").addEventListener("click", () => {
        currentDate.setDate(currentDate.getDate() + 1);
        loadReviewWardForSelectedDate();
    });

    document.getElementById("todayBtn").addEventListener("click", () => {
        currentDate = new Date();
        loadReviewWardForSelectedDate();
    });

    // Kezdő dátum (mai nap) betöltése
    await loadReviewWardForSelectedDate();
});
</script>

</body>

</html>
