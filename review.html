<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>

DrugAssist - Gyógyszerészi ellenőrzés

</title>

<style>

*{

    box-sizing:border-box;

}

body{

    margin:0;

    font-family:"Segoe UI",Arial,sans-serif;

    background:#f4f6f9;

}

header{

    background:white;

    padding:14px 32px;

    border-bottom:1px solid #e0e0e0;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

header h1{

    margin:0;

    font-size:28px;

    font-weight:600;

}

.header-right {
    display: flex;
    align-items: center;
    gap: 20px;
}

.user-info{

    color:#2c3e50;

    font-size:14px;

    font-weight: 500;

    display: flex;

    align-items: center;

    gap: 12px;

}

.clock-badge {
    background: #eef4fb;
    padding: 6px 12px;
    border-radius: 8px;
    color: #2980b9;
    font-weight: 600;
}

.logout-btn {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: 0.2s;
}

.logout-btn:hover {
    background: #c0392b;
}

.container{

    max-width:1200px;

    margin:auto;

    padding:32px;

}

.card{

    background:white;

    border-radius:14px;

    padding:24px;

    margin-bottom:24px;

    box-shadow:0 4px 14px rgba(0,0,0,.05);

}

.patient-name{

    font-size:28px;

    font-weight:700;

    color:#1565c0;

    margin-bottom:24px;

}

.patient-data{

    display:grid;

    grid-template-columns:170px 1fr;

    row-gap:12px;

    column-gap:16px;

    align-items:center;

}

.label{

    font-weight:600;

    color:#546e7a;

}

#reviewTitle{

    margin-top:0;

    margin-bottom:24px;

    color:#1565c0;

    font-size:24px;

}

.review-table{

    width:100%;

    border-collapse:collapse;

}

.review-table th{

    background:#f7f8fa;

    border-bottom:2px solid #e0e0e0;

    padding:12px;

    font-size:14px;

}

.review-table td{

    border-bottom:1px solid #eeeeee;

    padding:14px 12px;

}

.drug-cell{

    width:340px;

}

.drug-name{

    font-size:16px;

    font-weight:600;

    margin-bottom:8px;

}

.drug-morphology{

    font-size:12px;

    color:#777;

    line-height:1.4;

}

.dose{

    text-align:center;

    font-weight:700;

    font-size:16px;

    vertical-align:middle;

}

.check-cell{

    width:70px;

    text-align:center;

}

.check-button{

    width:36px;

    height:36px;

    margin:auto;

    display:flex;

    justify-content:center;

    align-items:center;

    border-radius:8px;

    border:2px solid #9e9e9e;

    background:#eeeeee;

    color:#616161;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;

    user-select:none;

    transition:
        transform .15s,
        background .25s,
        color .25s,
        border-color .25s;

}

.check-button:hover{

    transform:scale(1.08);

}

.check-button:active{

    transform:scale(.92);

}

.check-button.checked{

    background:#2e7d32;

    border-color:#2e7d32;

    color:white;

}

.reviewed td{

    background:#e8f5e9;

}

.reviewed .drug-name,
.reviewed .drug-morphology,
.reviewed .dose{

    opacity:.6;

}

.complete{

    display:flex;

    justify-content:center;

    margin-top:30px;

}

.complete button{

    min-width:320px;

    background:#2e7d32;

    color:white;

    border:none;

    border-radius:8px;

    padding:14px 34px;

    font-size:17px;

    font-weight:600;

    cursor:pointer;

    transition:
        background .2s,
        transform .15s;

}

.complete button:hover:not(:disabled){

    background:#256428;

}

.complete button:active:not(:disabled){

    transform:scale(.98);

}

.complete button:disabled{

    background:#bdbdbd;

    color:#eeeeee;

    cursor:not-allowed;

}

@media (max-width:900px){

    .patient-data{

        grid-template-columns:1fr;

    }

    .container{

        padding:0 12px;

    }

}

.check-button.disabled{

    opacity: .45;

    cursor: default;

    pointer-events: none;

    filter: grayscale(100%);

}

.modal-buttons{

    display:flex;

    justify-content:flex-end;

    gap:12px;

    margin-top:20px;

}

.modal-buttons button{

    min-width:120px;

    padding:10px 18px;

    border:none;

    border-radius:8px;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:.2s;

}

#cancelBarcode{

    background:#e5e7eb;

    color:#374151;

}

#cancelBarcode:hover{

    background:#d1d5db;

}

#confirmBarcode{

    background:#1976d2;

    color:white;

}

#confirmBarcode:hover{

    background:#1565c0;

}


/* ========================================
Modal
======================================== */

.modal{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.45);

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:9999;

}

.hidden{

    display:none;

}

.modal-card{

    background:white;

    width:420px;

    max-width:92%;

    border-radius:14px;

    padding:28px;

    box-shadow:
        0 12px 40px rgba(0,0,0,.25);

}

.modal-card h2{

    margin-top:0;

}

.modal-card input{

    width:100%;

    padding:12px;

    font-size:18px;

    margin-top:16px;

    border-radius:8px;

    border:1px solid #ccc;

    box-sizing:border-box;

}

.barcode-error{

    color:#d32f2f;

    font-weight:bold;

    margin-top:14px;

    min-height:24px;

}

.modal-buttons{

    margin-top:22px;

    text-align:right;

}


</style>

</head>

<body>

<header>

<h1>

DrugAssist

</h1>

<div class="header-right">
    <div class="user-info">
        <span id="userNameDisplay">Bejelentkezett felhasználó</span>
        <span id="clockDisplay" class="clock-badge">----.--.-- --:--</span>
    </div>
    <button class="logout-btn" onclick="Auth.logout()">Kijelentkezés</button>
</div>

</header>

<div class="container">

<section class="card">

<div class="patient-name"
     id="patientName">

</div>

<div class="patient-data">

<div class="label">

Azonosító

</div>

<div id="patientId"></div>

<div class="label">

Osztály

</div>

<div id="patientWard"></div>

<div class="label">

Ágy

</div>

<div id="patientBed"></div>

<div class="label">

Készítési azonosító

</div>

<div id="productionId"></div>

<div class="label">

Készítette

</div>

<div id="preparedBy"></div>

</div>

</section>

<section class="card">

<h2 id="reviewTitle">

💊 Gyógyszerészi ellenőrzés

</h2>

<table class="review-table" id="reviewTable">

<thead id="reviewHead">

<tr>

<th>

Gyógyszer

</th>

<th>Éjjel</th>
<th>Hajnal</th>
<th>Reggel</th>
<th>Dél</th>
<th>Délután</th>
<th>Este</th>

<th class="check-cell">

✔

</th>

</tr>

</thead>

<tbody id="medicationTable">

<!-- review.js tölti fel -->

</tbody>

</table>

</section>

<div class="complete">

<button
    type="button"
    id="reviewButton"
    class="primary-button"
    disabled>

    ✔ Ellenőrzés lezárása

</button>

</div>

</div>

<!-- =========================================
Készítési azonosító modal
========================================= -->

<div id="barcodeModal" class="modal hidden">

    <div class="modal-card">

        <h2>📦 Készítési azonosító</h2>

        <p>

            Csippantsa be a készítmény
            vonalkódját.

        </p>

        <input
            id="barcodeInput"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="Vonalkód..."
        >

        <div
            id="barcodeError"
            class="barcode-error"
        >

        </div>

        <div class="modal-buttons">

    <button
        id="cancelBarcode">

        ✖ Mégse

    </button>

    <button
        id="confirmBarcode">

        ✔ Jóváhagyás

    </button>

</div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>

<script>
  if (typeof supabase !== 'undefined' && supabase.createClient && CONFIG.supabase.url && !CONFIG.supabase.url.includes("YOUR_SUPABASE")) {
    window.supabase = supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey);
  }
</script>

<script src="js/auth.js"></script>
<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/morphology.js"></script>
<script src="js/review.js"></script>

<!-- Munkamenet-védelem és élő óra logika -->
<script>
function formatDateForDisplay(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}.${m}.${d}`;
}

function updateClock() {
    const now = new Date();
    const dateStr = formatDateForDisplay(now);
    const hours = String(now.getHours()).padStart(2, '0');
    const mins = String(now.getMinutes()).padStart(2, '0');
    document.getElementById("clockDisplay").innerText = `${dateStr} ${hours}:${mins}`;
}

document.addEventListener("DOMContentLoaded", () => {
    // 1. Munkamenet védelmi ellenőrzés
    const currentUser = Auth.requireAuth();
    if (currentUser) {
        document.getElementById("userNameDisplay").innerText = currentUser.name;
    }

    // 2. Óra indítása
    updateClock();
    setInterval(updateClock, 10000);
});
</script>

</body>
</html>
