<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DrugAssist Lite</title>

<style>

body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:#f4f6f9;
}

/* HEADER */

header{
    background:white;
    padding:14px 32px;
    border-bottom:1px solid #e0e0e0;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    margin:0;
    font-size:22px;
    font-weight:600;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 20px;
}

.user-info{
    color:#2c3e50;
    font-size:14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 12px;
}

.clock-badge {
    background: #eef4fb;
    padding: 6px 12px;
    border-radius: 8px;
    color: #2980b9;
    font-weight: 600;
}

.logout-btn {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: 0.2s;
}

.logout-btn:hover {
    background: #c0392b;
}

/* CONTAINER */

.container{
    padding:32px;
}

/* DATE BAR / DÁTUMLÉPTETŐ */

.date-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    padding: 16px 24px;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.05);
    margin-bottom: 24px;
}

.date-picker-group {
    display: flex;
    align-items: center;
    gap: 12px;
}

.date-btn {
    background: #3498db;
    color: white;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
}

.date-btn:hover {
    background: #2980b9;
}

.current-date-display {
    font-size: 16px;
    font-weight: 600;
    color: #2c3e50;
    min-width: 140px;
    text-align: center;
}

.today-btn {
    background: #ecf0f1;
    color: #34495e;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.today-btn:hover {
    background: #bdc3c7;
}

/* IMPORT */

.import-card{
    background:white;
    border-radius:14px;
    padding:24px;

    box-shadow:
        0 4px 14px rgba(0,0,0,0.05);

    margin-bottom:40px;
}

.import-card h2{
    margin-top:0;
}

.import-area{
    border:2px dashed #2196f3;
    border-radius:12px;

    padding:40px;
    text-align:center;

    background:#f8fbff;
}

.import-area:hover{
    background:#eef6ff;
}

input[type=file]{
    margin-top:20px;
}

/* WARDS */

.section-title{
    font-size:20px;
    font-weight:600;
    margin-bottom:20px;
}

.ward-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(320px,1fr));

    gap:24px;
}

.ward-card{

    background:white;

    border-radius:14px;

    padding:22px;

    box-shadow:
        0 4px 14px rgba(0,0,0,0.05);

    cursor:pointer;

    transition:.2s;
}

.ward-card:hover{

    transform:translateY(-4px);

    box-shadow:
        0 8px 20px rgba(0,0,0,0.08);
}

.ward-header{

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.ward-name{

    font-size:18px;
    font-weight:600;
}

.ward-count{

    color:#666;
    margin-top:8px;
}

.progress-row{

    display:flex;

    gap:16px;

    margin-top:18px;

    font-size:14px;
}

.badge{

    padding:6px 12px;

    border-radius:20px;

    color:white;

    font-size:13px;
}

.badge-new{
    background:#9e9e9e;
}

.badge-progress{
    background:#ff9800;
}

.badge-done{
    background:#4caf50;
}

.completion{

    width:70px;
    height:70px;

    border-radius:18px;

    background:#e8f5e9;

    color:#4caf50;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:20px;
    font-weight:700;
}

.empty-state{

    background:white;

    border-radius:14px;

    padding:40px;

    text-align:center;

    color:#777;

    box-shadow:
        0 4px 14px rgba(0,0,0,0.05);
}

</style>
</head>

<body>

<header>

    <h1>DrugAssist Lite</h1>

    <div class="header-right">
        <div class="user-info">
            <span id="userNameDisplay">Bejelentkezett felhasználó</span>
            <span id="clockDisplay" class="clock-badge">----.--.-- --:--</span>
        </div>
        <button class="logout-btn" onclick="Auth.logout()">Kijelentkezés</button>
    </div>

</header>

<div class="container">

    <!-- DÁTUMLÉPTETŐ PANEL -->
    <div class="date-bar">
        <div class="date-picker-group">
            <button class="date-btn" id="prevDayBtn">&lt;</button>
            <span class="current-date-display" id="selectedDateDisplay">----.--.--</span>
            <button class="date-btn" id="nextDayBtn">&gt;</button>
        </div>
        <button class="today-btn" id="todayBtn">Mai nap</button>
    </div>

    <div class="import-card">

        <h2>Osztálylista PDF import</h2>

        <div class="import-area">

            <div>
                Húzd ide az ePharma osztálylista PDF-et
            </div>

            <input
                type="file"
                id="pdfInput"
                accept=".pdf"
            >

        </div>

    </div>

    <div class="section-title">
        Osztályok
    </div>

    <div
        id="wardContainer"
        class="ward-grid"
    >

        <div class="empty-state">
            Még nincs betöltött osztálylista.
        </div>

    </div>

</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Konfiguráció, Hitelesítés és Tároló -->
<script src="js/config.js"></script>

<script>
  if (typeof supabase !== 'undefined' && supabase.createClient && CONFIG.supabase.url && !CONFIG.supabase.url.includes("YOUR_SUPABASE")) {
    window.supabase = supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey);
  }
</script>

<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/render.js"></script>
<script src="js/pdf.min.js"></script>

<!-- Parserek -->
<script src="js/modules/dm-parser.js"></script>
<script src="js/modules/pdf-layout-parser.js"></script>
<script src="js/modules/patient-pdf-parser.js"></script>
<script src="js/modules/medication-parser.js"></script>

<!-- Alkalmazás modulok -->
<script src="js/departments.js"></script>
<script src="js/pdf-import.js"></script>

<!-- Helyi napléptető, óra és PDF import logika -->
<script>
let currentDate = new Date();

function formatDateForDisplay(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}.${m}.${d}`;
}

function formatDateForQuery(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

function updateClock() {
    const now = new Date();
    const dateStr = formatDateForDisplay(now);
    const hours = String(now.getHours()).padStart(2, '0');
    const mins = String(now.getMinutes()).padStart(2, '0');
    document.getElementById("clockDisplay").innerText = `${dateStr} ${hours}:${mins}`;
}

async function loadDataForSelectedDate() {
    const displayStr = formatDateForDisplay(currentDate);
    const queryStr = formatDateForQuery(currentDate);

    document.getElementById("selectedDateDisplay").innerText = displayStr;
    
    if (typeof Storage !== "undefined" && Storage.loadWards) {
        const wards = await Storage.loadWards(queryStr);
        if (typeof Render !== "undefined" && Render.renderWardCards) {
            Render.renderWardCards(wards);
        }
    }
}

async function handlePdfImport(event) {
    const file = event.target.files[0];
    if (!file) return;

    Utils.log("PDF kiválasztva:", file.name);

    try {
        const ward = await PdfImport.importWardPdf(file);

        if (Storage.mergeWard) {
            await Storage.mergeWard(ward);
        }

        // Adatok azonnali újratöltése a kiválasztott napra
        await loadDataForSelectedDate();

        Utils.log("Osztály sikeresen betöltve:", ward.wardName);
        
        // Input ürítése a következő beolvasáshoz
        event.target.value = "";

    } catch (error) {
        console.error("Hiba a PDF importálása során:", error);
    }
}

document.addEventListener("DOMContentLoaded", async () => {
    // 1. Munkamenet védelmi ellenőrzés
    const currentUser = Auth.requireAuth();
    if (currentUser) {
        document.getElementById("userNameDisplay").innerText = currentUser.name;
    }

    // 2. Óra indítása
    updateClock();
    setInterval(updateClock, 10000);

    // 3. PDF Input eseményfigyelő
    const pdfInput = document.getElementById("pdfInput");
    if (pdfInput) {
        pdfInput.addEventListener("change", handlePdfImport);
    }

    // 4. Dátumléptető események
    document.getElementById("prevDayBtn").addEventListener("click", () => {
        currentDate.setDate(currentDate.getDate() - 1);
        loadDataForSelectedDate();
    });

    document.getElementById("nextDayBtn").addEventListener("click", () => {
        currentDate.setDate(currentDate.getDate() + 1);
        loadDataForSelectedDate();
    });

    document.getElementById("todayBtn").addEventListener("click", () => {
        currentDate = new Date();
        loadDataForSelectedDate();
    });

    // Kezdő dátum (mai nap) betöltése
    await loadDataForSelectedDate();
});
</script>

</body>
</html>
